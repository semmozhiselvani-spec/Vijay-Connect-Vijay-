<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Track your Vijay Connect cab live on the map."><meta name="theme-color" content="#6d28d9"><title>Track Your Cab | Vijay Connect</title><link rel="icon" href="logo-black.png" type="image/png"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""><style>
body{margin:0;background:#faf8fd;color:#2d2436;font-family:Inter,Arial,sans-serif}.trackPage{min-height:100vh;padding:20px}.trackWrap{max-width:1100px;margin:auto}.trackHead{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:15px}.trackBrand{display:flex;align-items:center;gap:10px;text-decoration:none;color:#2d2436}.trackBrand img{width:42px;height:42px;object-fit:contain}.trackBrand strong{font-size:14px;letter-spacing:.6px}.trackBack{color:#5a20d6;text-decoration:none;font-size:11px;font-weight:900}.trackCard{background:#fff;border:1px solid #e7ddf0;border-radius:24px;padding:18px;box-shadow:0 20px 60px #32106412}.trackIntro{display:flex;justify-content:space-between;gap:20px;align-items:flex-end;margin-bottom:14px}.trackIntro h1{font-size:27px;margin:0 0 5px}.trackIntro p{font-size:11px;color:#887b92;margin:0}.trackForm{display:flex;gap:8px;max-width:480px}.trackForm input{flex:1;border:1px solid #ddd2e9;border-radius:12px;padding:12px;font-size:12px;outline:0}.trackForm button{border:0;border-radius:12px;background:#5a20d6;color:#fff;padding:0 17px;font-weight:900;cursor:pointer}.trackStatus{font-size:10px;font-weight:800;margin:10px 0;min-height:15px}.trackStatus.good{color:#21834a}.trackStatus.warn{color:#b04444}.livePill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;background:#f1ebff;color:#5a20d6;padding:7px 10px;font-size:9px;font-weight:900}.livePill i{width:7px;height:7px;border-radius:50%;background:#31a85d;box-shadow:0 0 0 4px #31a85d18}.mapBox{height:560px;border-radius:19px;overflow:hidden;border:1px solid #e6dcef}.trackMeta{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.metaBox{background:#faf8fd;border:1px solid #eee7f5;border-radius:13px;padding:12px}.metaBox small{display:block;color:#95899f;font-size:8px;font-weight:900}.metaBox strong{display:block;margin-top:5px;color:#4f1ac0;font-size:12px}.leaflet-popup-content{font:700 11px Inter,Arial}.cabMarker{width:34px;height:34px;border-radius:50%;background:#5a20d6;color:#fff;display:grid;place-items:center;border:3px solid #fff;box-shadow:0 5px 16px #32106444;font-size:17px}.emptyTrack{display:none;text-align:center;padding:55px 15px;color:#8c8198}.emptyTrack.show{display:block}.emptyTrack strong{display:block;color:#4f1ac0;margin-bottom:7px}.mapBox{position:relative;background:#e9e5dc}.mapToolbar{display:flex;gap:7px;justify-content:flex-end;margin:0 0 8px}.mapTool{border:1px solid #ded5e8;background:#fff;color:#4f1ac0;border-radius:12px;min-height:36px;padding:0 11px;font:800 10px Inter,Arial;cursor:pointer;box-shadow:0 5px 15px #32106412}.mapTool:hover{background:#f6f0ff}.mapTool:first-child{margin-right:auto}.leaflet-control-attribution{font-size:8px}.leaflet-control-zoom{display:none}.cabMarker{width:40px;height:40px;border-radius:50%;background:#6d28d9;color:#fff;display:grid;place-items:center;border:3px solid #fff;box-shadow:0 7px 20px #32106444;font-size:19px;transform:translateZ(0)}.cabMarker:after{content:'';position:absolute;width:52px;height:52px;border:2px solid #6d28d944;border-radius:50%;animation:vcPulse 1.8s infinite}.leaflet-popup-content-wrapper{border-radius:14px}.leaflet-popup-content{font:700 11px Inter,Arial;line-height:1.5}@keyframes vcPulse{0%{transform:scale(.75);opacity:.7}70%{transform:scale(1.15);opacity:0}100%{opacity:0}}@media(max-width:720px){.trackPage{padding:10px}.trackIntro{display:block}.trackForm{margin-top:13px;max-width:none}.mapBox{height:450px}.trackMeta{grid-template-columns:1fr}.trackHead{margin-bottom:10px}}
</style></head><body><main class="trackPage"><div class="trackWrap"><header class="trackHead"><a class="trackBrand" href="index.html"><img src="logo-black.png" alt="Vijay Connect"><strong>VIJAY CONNECT</strong></a><a class="trackBack" href="index.html">← Back to website</a></header><section class="trackCard"><div class="trackIntro"><div><div class="livePill"><i></i> LIVE CAB TRACKING</div><h1>Track your cab</h1><p>Enter the tracking code shared by Vijay Connect to see the cab's latest location.</p></div><form class="trackForm" id="trackForm"><input id="bookingCode" placeholder="Tracking code e.g. VC1234" autocomplete="off" required><button>Track</button></form></div><div class="trackStatus" id="trackStatus"></div><div class="mapToolbar"><button type="button" id="myLocationBtn" class="mapTool" aria-label="Center on cab">⌖ <span>Center on cab</span></button><button type="button" id="zoomInBtn" class="mapTool" aria-label="Zoom in">＋</button><button type="button" id="zoomOutBtn" class="mapTool" aria-label="Zoom out">−</button></div><div class="emptyTrack" id="emptyTrack"><strong>Waiting for cab location</strong>The driver has not started sharing the live location yet.</div><div class="mapBox" id="map"></div><div class="trackMeta"><div class="metaBox"><small>LAST UPDATED</small><strong id="updated">—</strong></div><div class="metaBox"><small>STATUS</small><strong id="cabStatus">Waiting for location</strong></div><div class="metaBox"><small>TRACKING CODE</small><strong id="codeOut">—</strong></div></div></section></div></main><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script><script src="vc-supabase.js"></script><script>
const cfg=window.VC_SUPABASE_CONFIG;const base=()=>String(cfg?.url||'').replace(/\/+$/,'');let map,marker,trailLine,lastPos,timer,code='';
function setStatus(t,c=''){const el=document.getElementById('trackStatus');el.textContent=t;el.className='trackStatus '+c}
function cabIcon(){return L.divIcon({className:'',html:'<div class="cabMarker" aria-label="Vijay Connect live cab">🚕</div>',iconSize:[40,40],iconAnchor:[20,20],popupAnchor:[0,-18]})}
function initMap(){map=L.map('map',{zoomControl:false,scrollWheelZoom:true,dragging:true,tap:true}).setView([13.0827,80.2707],11);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);document.getElementById('zoomInBtn').onclick=()=>map.zoomIn();document.getElementById('zoomOutBtn').onclick=()=>map.zoomOut();document.getElementById('myLocationBtn').onclick=()=>{if(marker){map.flyTo(marker.getLatLng(),16,{duration:.5});marker.openPopup()}else{map.setView([13.0827,80.2707],12)}}}
async function fetchLocation(){if(!code)return;try{const r=await fetch(base()+'/rest/v1/rpc/vc_get_cab_location',{method:'POST',headers:{apikey:cfg.key,Authorization:'Bearer '+cfg.key,'Content-Type':'application/json'},body:JSON.stringify({p_code:code})});if(!r.ok)throw new Error('Tracking service returned '+r.status);const rows=await r.json();if(!rows.length){document.getElementById('emptyTrack').classList.add('show');document.getElementById('map').style.display='none';document.getElementById('cabStatus').textContent='Waiting for location';return;}document.getElementById('emptyTrack').classList.remove('show');document.getElementById('map').style.display='block';map.invalidateSize();const x=rows[0],pos=[Number(x.lat),Number(x.lng)];if(!Number.isFinite(pos[0])||!Number.isFinite(pos[1]))throw new Error('Invalid cab coordinates');if(!marker){marker=L.marker(pos,{icon:cabIcon(),riseOnHover:true}).addTo(map);marker.bindPopup('<b>Vijay Connect Cab</b><br><span style="color:#21834a">● Live location</span>').openPopup();map.setView(pos,16);lastPos=pos;}else{marker.setLatLng(pos);if(lastPos && (Math.abs(lastPos[0]-pos[0])>0.00001 || Math.abs(lastPos[1]-pos[1])>0.00001)){map.panTo(pos,{animate:true,duration:.6});}lastPos=pos;}if(!trailLine)trailLine=L.polyline([pos],{color:'#6d28d9',weight:5,opacity:.78,lineCap:'round',lineJoin:'round'}).addTo(map);else{const points=trailLine.getLatLngs();points.push(pos);trailLine.setLatLngs(points.slice(-30));}document.getElementById('updated').textContent=new Date(x.updated_at).toLocaleTimeString();document.getElementById('cabStatus').textContent=x.status||'Live';document.getElementById('codeOut').textContent=x.booking_code;const ageMin=Math.round((Date.now()-new Date(x.updated_at).getTime())/60000);if(ageMin>=2)setStatus('⚠️ Last update was '+ageMin+' min ago. The driver may have poor network.','warn');else setStatus('✓ Live location updated','good');}catch(e){setStatus('⚠️ '+(e.message||'Unable to load live location'),'warn')}}
document.getElementById('trackForm').addEventListener('submit',e=>{e.preventDefault();code=document.getElementById('bookingCode').value.trim().toUpperCase();if(!code)return;document.getElementById('codeOut').textContent=code;clearInterval(timer);if(marker){map.removeLayer(marker);marker=null}if(trailLine){map.removeLayer(trailLine);trailLine=null}lastPos=null;fetchLocation();timer=setInterval(fetchLocation,5000)});initMap();const q=new URLSearchParams(location.search).get('booking');if(q){document.getElementById('bookingCode').value=q;document.getElementById('trackForm').requestSubmit()}
</script></body></html>
